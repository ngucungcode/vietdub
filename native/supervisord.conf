[unix_http_server]
file=%(ENV_DUB_RUNTIME_RUN_DIR)s/supervisor.sock
chmod=0700

[supervisord]
logfile=%(ENV_DUB_RUNTIME_LOG_DIR)s/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(ENV_DUB_RUNTIME_RUN_DIR)s/supervisord.pid
childlogdir=%(ENV_DUB_RUNTIME_LOG_DIR)s
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_DUB_RUNTIME_RUN_DIR)s/supervisor.sock

[program:qbittorrent]
command=/usr/bin/qbittorrent-nox --profile=%(ENV_DUB_QBITTORRENT_PROFILE)s --webui-port=8081
user=%(ENV_DUB_NATIVE_USER)s
environment=HOME="%(ENV_DUB_QBITTORRENT_PROFILE)s"
priority=10
autostart=true
autorestart=unexpected
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_DUB_RUNTIME_LOG_DIR)s/qbittorrent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:prowlarr]
command=%(ENV_DUB_PROWLARR_BIN)s -nobrowser -data=%(ENV_DUB_PROWLARR_DATA_DIR)s
user=%(ENV_DUB_NATIVE_USER)s
priority=20
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_DUB_RUNTIME_LOG_DIR)s/prowlarr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:worker]
command=%(ENV_DUB_VENV_DIR)s/bin/python -m dub_server.worker
directory=%(ENV_PROJECT_ROOT)s
user=%(ENV_DUB_NATIVE_USER)s
environment=HF_HUB_OFFLINE="1",TRANSFORMERS_OFFLINE="1",HF_DATASETS_OFFLINE="1",HF_HUB_DISABLE_TELEMETRY="1",PYTHONPATH="%(ENV_PYTHONPATH)s",VIENEU_CODEC_PATH="%(ENV_VIENEU_CODEC_PATH)s",DUB_TIGER_SOURCE_DIR="%(ENV_DUB_TIGER_SOURCE_DIR)s",DUB_VIENEU_ENTRYPOINT="%(ENV_DUB_VIENEU_ENTRYPOINT)s"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_DUB_RUNTIME_LOG_DIR)s/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true

[program:api]
command=%(ENV_DUB_VENV_DIR)s/bin/python -m uvicorn dub_server.api:app --host 127.0.0.1 --port %(ENV_DUB_API_PORT)s --workers 1
directory=%(ENV_PROJECT_ROOT)s
user=%(ENV_DUB_NATIVE_USER)s
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_DUB_RUNTIME_LOG_DIR)s/api.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
